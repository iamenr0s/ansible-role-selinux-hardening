---
# The human steps the role leaves to you: drop selinux=0, reboot through the relabel, run the role again.
- name: Verify the full enable path
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Staged but still disabled, nothing enforced
      ansible.builtin.command: "{{ item.cmd }}"
      loop:
        - {cmd: getenforce, want: Disabled}
        - {cmd: "sed -n 's/^SELINUX=//p' /etc/selinux/config", want: permissive}
        - {cmd: "test -e /.autorelabel", want: ""}
      loop_control:
        label: "{{ item.cmd }}"
      register: __r
      changed_when: false
      failed_when: __r.stdout != item.want

    - name: The audit reports the kernel parameter (bootloader is not this role's job)
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: audit
        linux_hardening_fail_on_error: false

    - name: Findings name the kernel parameter
      ansible.builtin.assert:
        that: linux_hardening_selinux_findings | selectattr('key', 'eq', 'kernel parameter selinux=0') | list | length == 1
        quiet: true

    - name: Drop selinux=0 and reboot (the filesystem relabel runs on this boot)
      ansible.builtin.command: grubby --update-kernel ALL --remove-args selinux=0
      changed_when: true

    - name: Reboot through the relabel
      ansible.builtin.reboot:
        reboot_timeout: 1200

    - name: SELinux is on, permissive, and the marker is gone
      ansible.builtin.command: "{{ item.cmd }}"
      loop:
        - {cmd: getenforce, want: Permissive}
        - {cmd: "sh -c 'test ! -e /.autorelabel && echo gone'", want: gone}
      loop_control:
        label: "{{ item.cmd }}"
      register: __p
      changed_when: false
      failed_when: __p.stdout != item.want

    - name: Run the role again to enforce
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
        linux_hardening_selinux_confirm_enforcing: true

    - name: Enforcing now
      ansible.builtin.command: getenforce
      register: __e
      changed_when: false
      failed_when: __e.stdout != 'Enforcing'

    - name: Audit is compliant
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: audit
