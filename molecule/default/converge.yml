---
# Containers have no selinuxfs, so SELinux reads as disabled: this exercises the staged enable (file level).
- name: Converge (remediate)
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Remediate
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
        linux_hardening_selinux_allow_enable_from_disabled: true
