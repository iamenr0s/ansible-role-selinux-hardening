---
# Containers have no selinuxfs, so SELinux reads as disabled: this exercises the staged enable (file level).
- name: Converge (remediate)
  hosts: all
  become: false
  gather_facts: true
  tasks:
    - name: Remediate
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        selinux_hardening_mode: remediate
        selinux_hardening_confirm_remediation: true
        selinux_hardening_allow_enable_from_disabled: true
