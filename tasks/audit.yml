---
- name: Gather SELinux state
  ansible.builtin.include_tasks: facts.yml

- name: Compare with desired state
  ansible.builtin.set_fact:
    __selinux_hardening_findings: >-
      {%- set out = [] -%}
      {%- set pkgs = ansible_facts['packages'] -%}
      {%- for p in ['selinux-policy-targeted', 'libselinux-utils', 'policycoreutils'] if p not in pkgs -%}
      {%- set _ = out.append({'key': 'package ' ~ p, 'expected': 'installed', 'actual': 'missing',
                              'fixable': true}) -%}
      {%- endfor -%}
      {%- if __selinux_hardening_runtime == 'disabled' -%}
      {%- set _ = out.append({'key': 'running SELinux mode', 'expected': selinux_hardening_state,
                              'actual': 'disabled (staged: config permissive + /.autorelabel,'
                                        ~ ' then reboot and run again)',
                              'fixable': false}) -%}
      {%- elif __selinux_hardening_runtime in ['enforcing', 'permissive']
               and __selinux_hardening_runtime != selinux_hardening_state -%}
      {%- set _ = out.append({'key': 'running SELinux mode', 'expected': selinux_hardening_state,
                              'actual': __selinux_hardening_runtime, 'fixable': true}) -%}
      {%- endif -%}
      {%- if __selinux_hardening_config.get('SELINUX') != __selinux_hardening_target_state -%}
      {%- set _ = out.append({'key': 'SELINUX in ' ~ selinux_hardening_config,
                              'expected': __selinux_hardening_target_state,
                              'actual': __selinux_hardening_config.get('SELINUX') | default('unset', true),
                              'fixable': true}) -%}
      {%- endif -%}
      {%- if __selinux_hardening_staging and not __selinux_hardening_autorelabel.stat.exists -%}
      {%- set _ = out.append({'key': 'relabel marker /.autorelabel', 'expected': 'present', 'actual': 'missing',
                              'fixable': true}) -%}
      {%- endif -%}
      {%- if __selinux_hardening_config.get('SELINUXTYPE') | default('') != selinux_hardening_policy -%}
      {%- set _ = out.append({'key': 'SELINUXTYPE in ' ~ selinux_hardening_config,
                              'expected': selinux_hardening_policy,
                              'actual': __selinux_hardening_config.get('SELINUXTYPE') | default('unset', true)
                                        ~ ' (reported only: changing the policy needs a relabel)',
                              'fixable': false}) -%}
      {%- endif -%}
      {%- set cmd = (__selinux_hardening_cmdline.content | default('') | b64decode).split() -%}
      {%- for a in ['selinux=0', 'enforcing=0'] if a in cmd -%}
      {%- set _ = out.append({'key': 'kernel parameter ' ~ a, 'expected': 'absent',
                              'actual': 'present (reported only: bootloader)', 'fixable': false}) -%}
      {%- endfor -%}
      {%- for n, want in selinux_hardening_booleans.items()
            if __selinux_hardening_booleans | length > 0
               and __selinux_hardening_booleans.get(n) != ('on' if want | bool else 'off') -%}
      {%- set _ = out.append({'key': 'boolean ' ~ n, 'expected': 'on' if want | bool else 'off',
                              'actual': __selinux_hardening_booleans.get(n) | default('unknown', true),
                              'fixable': n in __selinux_hardening_booleans}) -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: Record findings
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ __selinux_hardening_findings | from_json }}"

- name: Report selinux_hardening result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if selinux_hardening_findings | length == 0 else selinux_hardening_findings }}"

# After remediation only fixable findings fail the run; a staged enable and reported-only items need a human.
- name: Fail on findings
  ansible.builtin.fail:
    msg: "selinux_hardening found {{ __selinux_hardening_blocking | length }} deviation(s)."
  vars:
    __selinux_hardening_blocking: >-
      {{ (selinux_hardening_findings | selectattr('fixable') | list)
         if __selinux_hardening_audit_fatal | default(false)
         else (selinux_hardening_findings if selinux_hardening_fail_on_error | bool else []) }}
  when: __selinux_hardening_blocking | length > 0
