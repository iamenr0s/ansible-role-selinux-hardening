---
- name: audit | Gather SELinux state
  ansible.builtin.include_tasks: facts.yml

# Each check adds a finding {key, expected, actual, fixable} when the host deviates.
- name: audit | Start with no findings
  ansible.builtin.set_fact:
    selinux_hardening_findings: []

- name: audit | Check the SELinux packages
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding: {key: "package {{ item }}", expected: installed, actual: missing, fixable: true}
  loop: "{{ __selinux_hardening_packages | reject('in', ansible_facts['packages']) | list }}"

- name: audit | Check the running mode (disabled, staged)
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding:
      key: running SELinux mode
      expected: "{{ selinux_hardening_state }}"
      actual: "disabled (staged: config permissive + /.autorelabel, then reboot and run again)"
      fixable: false
  when: __selinux_hardening_runtime == 'disabled'

- name: audit | Check the running mode
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding:
      key: running SELinux mode
      expected: "{{ selinux_hardening_state }}"
      actual: "{{ __selinux_hardening_runtime }}"
      fixable: true
  when:
    - __selinux_hardening_runtime in ['enforcing', 'permissive']
    - __selinux_hardening_runtime != selinux_hardening_state

- name: audit | Check SELINUX in the configuration
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding:
      key: "SELINUX in /etc/selinux/config"
      expected: "{{ __selinux_hardening_target_state }}"
      actual: "{{ __selinux_hardening_config.SELINUX | default('unset', true) }}"
      fixable: true
  when: __selinux_hardening_config.SELINUX | default('') != __selinux_hardening_target_state

- name: audit | Check the relabel marker
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding: {key: relabel marker /.autorelabel, expected: present, actual: missing, fixable: true}
  when: __selinux_hardening_staging and not __selinux_hardening_autorelabel.stat.exists

- name: audit | Check SELINUXTYPE in the configuration (reported only)
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding:
      key: "SELINUXTYPE in /etc/selinux/config"
      expected: "{{ selinux_hardening_policy }}"
      actual: >-
        {{ __selinux_hardening_config.SELINUXTYPE | default('unset', true) }}
        (reported only: changing the policy needs a relabel)
      fixable: false
  when: __selinux_hardening_config.SELINUXTYPE | default('') != selinux_hardening_policy

- name: audit | Check the kernel command line (reported only)
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_finding:
      key: "kernel parameter {{ item }}"
      expected: absent
      actual: "present (reported only: bootloader)"
      fixable: false
  loop: >-
    {{ ['selinux=0', 'enforcing=0']
       | select('in', (__selinux_hardening_cmdline.content | default('') | b64decode).split()) | list }}

# Booleans are only known while SELinux runs; an unknown boolean is reported, not fixable.
- name: audit | Check the booleans
  ansible.builtin.set_fact:
    selinux_hardening_findings: "{{ selinux_hardening_findings + [__selinux_hardening_finding] }}"
  vars:
    __selinux_hardening_want: "{{ 'on' if item.value | bool else 'off' }}"
    __selinux_hardening_finding:
      key: "boolean {{ item.key }}"
      expected: "{{ __selinux_hardening_want }}"
      actual: "{{ __selinux_hardening_current_booleans.get(item.key) | default('unknown', true) }}"
      fixable: "{{ item.key in __selinux_hardening_current_booleans }}"
  loop: "{{ selinux_hardening_booleans | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - __selinux_hardening_current_booleans | length > 0
    - __selinux_hardening_current_booleans.get(item.key) != __selinux_hardening_want

- name: audit | Report each finding
  ansible.builtin.debug:
    msg: >-
      {{ item.key }}: expected {{ item.expected }}, got {{ item.actual }}{{ '' if item.fixable else ' (manual)' }}
  loop: "{{ selinux_hardening_findings }}"
  loop_control:
    label: "{{ item.key }}"

- name: audit | Report compliance
  ansible.builtin.debug:
    msg: selinux_hardening is COMPLIANT
  when: selinux_hardening_findings | length == 0

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "selinux_hardening found {{ selinux_hardening_findings | length }} deviation(s)."
  when:
    - not __selinux_hardening_audit_fatal | default(false)
    - selinux_hardening_fail_on_error | bool
    - selinux_hardening_findings | length > 0

# After remediation only fixable findings fail the run; a staged enable and reported-only items need a human.
- name: audit | Fail on fixable findings left after remediation
  ansible.builtin.fail:
    msg: >-
      selinux_hardening left {{ selinux_hardening_findings | selectattr('fixable') | list | length }}
      fixable deviation(s).
  when:
    - __selinux_hardening_audit_fatal | default(false)
    - selinux_hardening_findings | selectattr('fixable') | list | length > 0
