---
# Read-only. Sets __lh_se_runtime (enforcing|permissive|disabled|missing), __lh_se_config (parsed file),
# __lh_se_booleans (name -> on|off), __lh_se_target_state, __lh_se_staging.
- name: Gather package facts
  ansible.builtin.package_facts:

- name: Look for getenforce
  ansible.builtin.stat:
    path: /usr/sbin/getenforce
  register: __lh_se_getenforce

- name: Read the running mode
  ansible.builtin.command: getenforce
  register: __lh_se_getenforce_out
  changed_when: false
  failed_when: false
  check_mode: false
  when: __lh_se_getenforce.stat.exists

- name: Read the SELinux configuration
  ansible.builtin.slurp:
    src: "{{ linux_hardening_selinux_config }}"
  register: __lh_se_config_raw
  failed_when: false
  check_mode: false

- name: Read the kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: __lh_se_cmdline
  failed_when: false
  check_mode: false

- name: Look for the relabel marker
  ansible.builtin.stat:
    path: /.autorelabel
  register: __lh_se_autorelabel

- name: Work out the runtime mode and the configuration
  ansible.builtin.set_fact:
    __lh_se_runtime: "{{ (__lh_se_getenforce_out.stdout | default('missing')) | trim | lower if __lh_se_getenforce.stat.exists else 'missing' }}"
    __lh_se_config: >-
      {%- set out = {} -%}
      {%- for l in (__lh_se_config_raw.content | default('') | b64decode).splitlines() -%}
      {%- set p = l.split('=', 1) -%}
      {%- if p | length == 2 and not p[0].strip().startswith('#') -%}
      {%- set _ = out.update({p[0].strip(): p[1].strip()}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: Normalise and decide the target
  ansible.builtin.set_fact:
    __lh_se_config: "{{ __lh_se_config | from_json }}"
    __lh_se_staging: "{{ __lh_se_runtime == 'disabled' }}"
    __lh_se_target_state: "{{ 'permissive' if __lh_se_runtime == 'disabled' else linux_hardening_selinux_state }}"

- name: Read the booleans
  ansible.builtin.command: getsebool -a
  register: __lh_se_getsebool
  changed_when: false
  failed_when: false
  check_mode: false
  when: __lh_se_runtime in ['enforcing', 'permissive']

- name: Parse the booleans
  ansible.builtin.set_fact:
    __lh_se_booleans: >-
      {%- set out = {} -%}
      {%- for l in (__lh_se_getsebool.stdout | default('')).splitlines() -%}
      {%- set p = l.split(' --> ') -%}
      {%- if p | length == 2 -%}{%- set _ = out.update({p[0].strip(): p[1].strip()}) -%}{%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: Normalise the booleans
  ansible.builtin.set_fact:
    __lh_se_booleans: "{{ __lh_se_booleans | from_json }}"
