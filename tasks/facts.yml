---
# Read-only. Sets __selinux_hardening_runtime (enforcing|permissive|disabled|missing),
# __selinux_hardening_config (parsed file), __selinux_hardening_booleans (name -> on|off),
# __selinux_hardening_target_state, __selinux_hardening_staging.
- name: facts | Gather package facts
  ansible.builtin.package_facts:

- name: facts | Look for getenforce
  ansible.builtin.stat:
    path: /usr/sbin/getenforce
  register: __selinux_hardening_getenforce

- name: facts | Read the running mode
  ansible.builtin.command: getenforce
  register: __selinux_hardening_getenforce_out
  changed_when: false
  failed_when: false
  check_mode: false
  when: __selinux_hardening_getenforce.stat.exists

- name: facts | Read the SELinux configuration
  ansible.builtin.slurp:
    src: "{{ selinux_hardening_config }}"
  register: __selinux_hardening_config_raw
  failed_when: false
  check_mode: false

- name: facts | Read the kernel command line
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: __selinux_hardening_cmdline
  failed_when: false
  check_mode: false

- name: facts | Look for the relabel marker
  ansible.builtin.stat:
    path: /.autorelabel
  register: __selinux_hardening_autorelabel

- name: facts | Work out the runtime mode and the configuration
  ansible.builtin.set_fact:
    __selinux_hardening_runtime: >-
      {{ (__selinux_hardening_getenforce_out.stdout | default('missing')) | trim | lower
         if __selinux_hardening_getenforce.stat.exists else 'missing' }}
    # KEY=value pairs; commented lines never match.
    __selinux_hardening_config: >-
      {{ dict(__selinux_hardening_config_raw.content | default('') | b64decode
              | regex_findall('(?m)^\s*(\w+)\s*=\s*(\S*)')) }}

- name: facts | Decide the target
  ansible.builtin.set_fact:
    __selinux_hardening_staging: "{{ __selinux_hardening_runtime == 'disabled' }}"
    __selinux_hardening_target_state: >-
      {{ 'permissive' if __selinux_hardening_runtime == 'disabled' else selinux_hardening_state }}

- name: facts | Read the booleans
  ansible.builtin.command: getsebool -a
  register: __selinux_hardening_getsebool
  changed_when: false
  failed_when: false
  check_mode: false
  when: __selinux_hardening_runtime in ['enforcing', 'permissive']

- name: facts | Parse the booleans
  ansible.builtin.set_fact:
    __selinux_hardening_booleans: >-
      {{ dict(__selinux_hardening_getsebool.stdout | default('') | regex_findall('(?m)^(\S+) --> (\w+)\s*$')) }}
