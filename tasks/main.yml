---
# audit: read-only. remediate: packages, /etc/selinux/config, running mode, booleans. Never reboots.
- name: Run selinux_hardening
  when: selinux_hardening_enabled | bool
  block:
    # meta/argument_specs.yml already validates the inputs; only the OS family fact is needed.
    - name: Gather the minimum facts
      ansible.builtin.setup:
        gather_subset: [min]
      when: ansible_facts['os_family'] is not defined

    - name: Skip other OS families
      ansible.builtin.set_fact:
        selinux_hardening_findings: []
      when: ansible_facts['os_family'] != 'RedHat'

    - name: Say why the role was skipped
      ansible.builtin.debug:
        msg: >-
          selinux_hardening applies to the RedHat family (EL, Fedora);
          {{ ansible_facts['os_family'] }} is skipped (see apparmor_hardening).
      when: ansible_facts['os_family'] != 'RedHat'

    - name: Run on the RedHat family
      when: ansible_facts['os_family'] == 'RedHat'
      block:
        - name: Audit (read-only)
          ansible.builtin.include_tasks: audit.yml
          when: selinux_hardening_mode == 'audit'

        - name: Remediate
          when: selinux_hardening_mode == 'remediate'
          block:
            - name: Require explicit remediation confirmation
              ansible.builtin.assert:
                that: selinux_hardening_confirm_remediation | bool
                fail_msg: >-
                  Remediation changes SELinux settings. Set selinux_hardening_confirm_remediation: true
                  to proceed (run with selinux_hardening_mode: audit to preview).
                quiet: true

            - name: Configure
              ansible.builtin.include_tasks: configure.yml

            - name: Verify effective configuration
              ansible.builtin.include_tasks: audit.yml
              vars:
                __selinux_hardening_audit_fatal: true
              # Check mode changes nothing, so the re-audit would always fail.
              when: selinux_hardening_verify | bool and not ansible_check_mode
