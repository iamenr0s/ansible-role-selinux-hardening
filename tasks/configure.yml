---
- name: configure | Gather package facts
  ansible.builtin.package_facts:

- name: configure | Ensure the SELinux packages are installed
  ansible.builtin.package:
    name: "{{ __selinux_hardening_packages }}"
    state: present
  when: __selinux_hardening_packages | reject('in', ansible_facts['packages']) | list | length > 0

# The runtime mode is only known once getenforce exists, so decide staging and guards after the install.
- name: configure | Re-gather SELinux state
  ansible.builtin.include_tasks: facts.yml

- name: configure | Refuse to stage the enable from disabled without consent
  ansible.builtin.assert:
    that: selinux_hardening_allow_enable_from_disabled | bool
    fail_msg: >-
      SELinux is disabled. Enabling it needs a full filesystem relabel and a reboot. Set
      selinux_hardening_allow_enable_from_disabled: true to stage it (config -> permissive, /.autorelabel);
      the role does not reboot. After the relabel boot, run it again to reach {{ selinux_hardening_state }}.
    quiet: true
  when: __selinux_hardening_staging | bool

- name: configure | Refuse to enforce without consent
  ansible.builtin.assert:
    that: selinux_hardening_confirm_enforcing | bool
    fail_msg: >-
      SELinux is permissive and would be switched to enforcing, which can break services that relied on it.
      Check `ausearch -m avc -ts boot`, then set selinux_hardening_confirm_enforcing: true to proceed.
    quiet: true
  when: __selinux_hardening_runtime == 'permissive' and selinux_hardening_state == 'enforcing'

- name: configure | Set SELINUX in the configuration
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: "^SELINUX="
    line: "SELINUX={{ __selinux_hardening_target_state }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    backup: "{{ selinux_hardening_backup | bool }}"

- name: configure | Ask for a relabel at the next boot
  ansible.builtin.file:
    path: /.autorelabel
    state: touch
    modification_time: preserve
    access_time: preserve
    mode: "0644"
  when: __selinux_hardening_staging | bool

- name: configure | Set the running mode
  ansible.builtin.command: "setenforce {{ 1 if selinux_hardening_state == 'enforcing' else 0 }}"
  changed_when: true
  when:
    - __selinux_hardening_runtime in ['enforcing', 'permissive']
    - __selinux_hardening_runtime != selinux_hardening_state

- name: configure | Ensure the SELinux Python bindings are installed
  ansible.builtin.package:
    name: "{{ __selinux_hardening_binding_packages }}"
    state: present
  when: __selinux_hardening_current_booleans | length > 0 and selinux_hardening_booleans | length > 0

# Unknown booleans are only reported (not fixable).
# An empty __selinux_hardening_current_booleans means SELinux is disabled.
- name: configure | Set the booleans
  ansible.posix.seboolean:
    name: "{{ item.key }}"
    state: "{{ item.value | bool }}"
    persistent: true
  loop: "{{ selinux_hardening_booleans | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - __selinux_hardening_current_booleans | length > 0
    - item.key in __selinux_hardening_current_booleans
    # Check mode cannot install the bindings the module imports.
    - not ansible_check_mode or __selinux_hardening_binding_packages is subset(ansible_facts['packages'].keys())
