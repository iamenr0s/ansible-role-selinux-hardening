---
# --- Mode and safety switches ---
selinux_hardening_mode: audit                    # audit (read-only) | remediate
selinux_hardening_confirm_remediation: false     # must be true for any change
selinux_hardening_backup: true
selinux_hardening_verify: true
selinux_hardening_fail_on_error: true

# --- SELinux settings (EL / Fedora; other families are skipped, see apparmor_hardening) ---
selinux_hardening_enabled: true

selinux_hardening_state: enforcing       # enforcing | permissive
# Only reported: changing the policy type needs a relabel and is not done by this role.
selinux_hardening_policy: targeted

# Raising the running mode from permissive to enforcing can break services that were relying on it.
selinux_hardening_confirm_enforcing: false
# SELinux is disabled: allow staging (config -> permissive, /.autorelabel). The role never reboots; reboot,
# let the relabel finish, then run the role again to reach enforcing.
selinux_hardening_allow_enable_from_disabled: false

# Persistent SELinux booleans {name: true|false}. Skipped while SELinux is disabled.
selinux_hardening_booleans: {}
